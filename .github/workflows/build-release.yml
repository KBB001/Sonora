name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version tag to build & release (e.g. v1.0.1). Leave empty to auto-generate from run number.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle & Cache dependencies
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            RAW_TAG="${{ github.event.inputs.version_name }}"
          else
            RAW_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          case "$RAW_TAG" in
            v*) TAG="$RAW_TAG" ;;
            *)  TAG="v$RAW_TAG" ;;
          esac
          CLEAN_VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare Android Keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/release-keystore.jks"
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::KEYSTORE_BASE64 is set, but KEYSTORE_PASSWORD secret is missing."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
            echo "using_fallback=false" >> "$GITHUB_OUTPUT"
            echo "Decoded release keystore from KEYSTORE_BASE64 secret."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not configured. Generating a temporary CI release keystore so the APK builds successfully. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_PASSWORD in Repository Secrets for consistent OTA update signatures."
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "sonora-ci-release" \
              -keypass "sonora-ci-release" \
              -dname "CN=Sonora CI, OU=Mobile, O=Sonora, L=Unknown, ST=Unknown, C=US"
            echo "using_fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDK_MANAGER" ] && [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          STORE_PASSWORD: ${{ steps.keystore.outputs.using_fallback == 'true' && 'sonora-ci-release' || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.using_fallback == 'true' && 'sonora-ci-release' || (secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD) }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: >
          gradle :app:assembleRelease
          --no-daemon
          --no-configuration-cache
          --no-build-cache
          --max-workers=2
          --console=plain
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Prepare Release APK Artifact
        shell: bash
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK not found at $APK_SRC"
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_SRC" "release-assets/sonora-${{ steps.version.outputs.tag }}.apk"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Sonora ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
