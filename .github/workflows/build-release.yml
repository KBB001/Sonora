name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version tag to build & release (e.g. v1.0.1). Leave empty to auto-generate from run number.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle & Cache dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            TAG="${{ github.event.inputs.version_name }}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          CLEAN_VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode Android Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEY_PASSWORD in Repository Secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release-keystore.jks"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare Release APK Artifact
        shell: bash
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK not found at $APK_SRC"
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_SRC" "release-assets/sonora-${{ steps.version.outputs.tag }}.apk"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Sonora ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
