name: Sonora
options:
  bundleIdPrefix: com.aistudio.sonora
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Sonora:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sonora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.sonora.ios
        INFOPLIST_FILE: Sonora/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: "NO"
schemes:
  Sonora:
    build:
      targets:
        Sonora: all
    run:
      config: Debug
